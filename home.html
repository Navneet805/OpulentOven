<!DOCTYPE html>
<html lang="en">
<head>
    <title>Opulent Oven - Home</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            height: 100%;
        }
        .carousel-wrapper {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            top: 120px; 
            height: calc(100vh - 120px);
        }
        .carousel-img {
            width: 100vw;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            transition: opacity 0.8s;
        }
        header {
            background-color: #c37960;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
        }
        .logout-button {
            float: right;
            background-color:  #c37960;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 15px;
            margin: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            height:30px;
            z-index: 3;
        }
        .logout-button:hover {
            background-color: #894e34;
            transform: scale(1.05);
        }
        nav {
            background-color: rgba(51, 51, 51); 
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
        }
        nav a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            text-align: center;
            transition: background-color 0.3s ease;
            font-weight: 500;
        }
        nav a:hover {
            background-color: rgba(87, 87, 87, 0.7);
        }
        .center-content {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.85);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            padding: 48px 40px 40px 40px;
            max-width: 500px;
            width: 90vw;
            text-align: center;
            z-index: 2;
        }
        #welcome {
            font-size: 2rem;
            color: #c37960;
            margin-top:0;
        }
        .center-content p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }
        .center-content button {
            padding: 15px 30px;
            margin: 10px;
            background-color: #c37960;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .center-content button:hover {
            background-color: #894e34;
            transform: scale(1.05);
        }
       
    </style>
    <script>
        function logout() {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }
        const carouselImages = ["a.jpg", "b.jpg", "c.jpg"];
        let carouselIndex = 0;
        let carouselInterval = null;

        function showCarouselImage(idx) {
            const img = document.getElementById("carousel-img");
            img.style.opacity = 0;
            setTimeout(function() {
                img.src = carouselImages[idx];
                img.style.opacity = 1;
            }, 200);
        }

        function nextCarousel() {
            carouselIndex = (carouselIndex + 1) % carouselImages.length;
            showCarouselImage(carouselIndex);
        }

        function startCarouselInterval() {
            carouselInterval = setInterval(() => {
                nextCarousel();
            }, 5000); 
        }
        
        window.onload = function() {
            const username = localStorage.getItem("username");
            if (username) {
                document.getElementById("welcome").textContent = "Welcome, "+username+"!";
            } else {
                document.getElementById("welcome").textContent = "Welcome, Guest!";
                document.getElementsByClassName("logout-button")[0].innerHTML = "Login";
            }
            showCarouselImage(carouselIndex);
            startCarouselInterval();
        };
    </script>
</head>
<body>
    <header>
        Opulent Oven
    </header>
    <nav>
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="cart.html">Cart</a>
        <button class="logout-button" onclick="logout()">Logout</button>

    </nav>
    <div class="carousel-wrapper">
        <img id="carousel-img" class="carousel-img" src="1.jpg" alt="About Opulent Oven">
    </div>
    <div class="center-content">
        <h2 id="welcome"></h2>
        <p>Discover the finest bakery items crafted with love and care.</p>
        <button onclick="window.location.href='menu.html'">See Our Menu</button>
        <button onclick="window.location.href='customcake.html'">Order a Custom Cake</button>
    </div>
</body>
</html>
